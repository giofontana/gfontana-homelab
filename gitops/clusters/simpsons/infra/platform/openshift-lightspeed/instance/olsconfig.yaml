apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
spec:
  llm:
    providers:
      - name: qwen
        type: rhoai_vllm
        url: http://qwen3-14b-fp8-predictor.llm-models.svc.cluster.local:8080/v1
        credentialsSecretRef:
          name: llm-credentials
        models:
          - name: qwen3-14b-fp8
            contextWindowSize: 30000
  ols:
    defaultProvider: qwen
    defaultModel: qwen3-14b-fp8
