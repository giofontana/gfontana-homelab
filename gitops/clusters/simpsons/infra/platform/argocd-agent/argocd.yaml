apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd-hub
  namespace: argocd-hub
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Principal hub: agents on ocp1/ocp2 reconcile locally; no app-controller here.
  controller:
    enabled: false

  argoCDAgent:
    principal:
      enabled: true
      # Agent client certs are the gitops-addon registration certs issued by ACM:
      #   CN=system:open-cluster-management:cluster:<cluster>:addon:gitops-addon:agent:gitops-addon-agent
      # The capture group is the agent name (= ManagedCluster name).
      auth: "mtls:CN=system:open-cluster-management:cluster:([^:]+):addon:gitops-addon:agent:gitops-addon-agent"
      # Applications for the agents live in argocd-hub and pick the agent via spec.destination.name.
      destinationBasedMapping: true
      logLevel: info
      namespace:
        allowedNamespaces:
          - argocd-hub
      server:
        route:
          enabled: true
      # CA, principal TLS, resource-proxy TLS and JWT secrets are generated by the ACM
      # GitOpsCluster controller (argocd-agent-ca, argocd-agent-principal-tls,
      # argocd-agent-resource-proxy-tls, argocd-agent-jwt). Never self-generate.
      tls:
        insecureGenerate: false
      jwt:
        insecureGenerate: false

  server:
    route:
      enabled: true

  sso:
    provider: dex
    dex:
      openShiftOAuth: true

  rbac:
    defaultPolicy: ""
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
    scopes: "[groups]"
