apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-agent
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  labels:
    gitops.ownedBy: default
spec:
  destination:
    namespace: argocd-hub
    server: https://kubernetes.default.svc
  project: default
  source:
    path: gitops/clusters/simpsons/infra/platform/argocd-agent/
    repoURL: https://github.com/giofontana/gfontana-homelab.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    # Filled in by the ACM GitOpsCluster controller after discovery.
    - group: apps.open-cluster-management.io
      kind: GitOpsCluster
      jsonPointers:
        - /spec/gitopsAddon/argoCDAgent/serverAddress
        - /spec/gitopsAddon/argoCDAgent/serverPort
