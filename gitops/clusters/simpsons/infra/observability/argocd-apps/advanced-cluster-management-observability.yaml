apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: advanced-cluster-management-observability
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  labels:
    gitops.ownedBy: default
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    path: gitops/clusters/simpsons/infra/observability/advanced-cluster-management-observability/aggregate
    repoURL: https://github.com/giofontana/gfontana-homelab.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
