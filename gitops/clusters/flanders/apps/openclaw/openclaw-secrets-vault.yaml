# Pulls every property of secret/openclaw/secrets into the openclaw-secrets Secret.
# Property names must match the env var names the Deployment reads:
#   OPENCLAW_GATEWAY_TOKEN (required)
#   HA_MCP_URL, HA_TOKEN (required: see components/apps/openclaw/config/patch-ha-env.yaml)
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, OPENROUTER_API_KEY (optional)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-secrets
  namespace: openclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openclaw-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: openclaw/secrets
