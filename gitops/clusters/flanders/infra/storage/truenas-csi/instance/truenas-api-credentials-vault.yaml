apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-api-credentials
  namespace: truenas-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: truenas-api-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: truenas-csi/api-credentials
        property: api-key
