# The Grafana Route uses spec.tls.externalCertificate, so the ingress router
# must be able to read that one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-read-grafana-mon-tls
  namespace: homelab-monitoring
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-mon-tls"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-read-grafana-mon-tls
  namespace: homelab-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-read-grafana-mon-tls
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
