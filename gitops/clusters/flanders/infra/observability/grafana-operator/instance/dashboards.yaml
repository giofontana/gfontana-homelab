# Community dashboards for the homelab exporters. Imported dashboards declare a
# datasource input, which is mapped to the homelab datasource here; the rest use
# a datasource variable that defaults to it.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: unifi-network-sites
  namespace: homelab-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  folder: Homelab
  instanceSelector:
    matchLabels:
      instance: grafana
  grafanaCom:
    id: 11311
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: homelab
---
