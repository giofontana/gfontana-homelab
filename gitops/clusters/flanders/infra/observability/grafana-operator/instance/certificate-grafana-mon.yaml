apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-mon
  namespace: homelab-monitoring
spec:
  secretName: grafana-mon-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: mon.gfontana.me
  dnsNames:
    - mon.gfontana.me
  usages:
    - digital signature
    - key encipherment
    - server auth
  renewBefore: 720h  # Renew 30 days before expiry
