              "legendFormat": "__auto",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Name"
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "Value": true
                },
                "renameByName": {
                  "friendly_name": "Name",
                  "entity": "Entity",
                  "domain": "Domain"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "type": "table",
          "title": "Updates pending",
          "id": 21,
          "datasource": {
            "type": "prometheus",
