                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Illuminance",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "homeassistant_sensor_illuminance_lx{job=\"home-assistant\"}",
              "refId": "A",
              "legendFormat": "{{friendly_name}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
