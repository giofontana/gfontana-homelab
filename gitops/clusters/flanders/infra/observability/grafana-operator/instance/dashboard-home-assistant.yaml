                "fillOpacity": 10,
                "drawStyle": "line",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Energy",
          "id": 13,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Power",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 16,
