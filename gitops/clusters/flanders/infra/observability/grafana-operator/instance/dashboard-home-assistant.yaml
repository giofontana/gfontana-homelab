                "drawStyle": "line",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "bargauge",
          "title": "Energy used in range",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Increase of each kWh counter over the selected time range",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 23
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(increase(homeassistant_sensor_energy_kwh{job=\"home-assistant\"}[$__range]) > 0)",
              "refId": "A",
              "legendFormat": "{{friendly_name}}",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
