# Long-lived Home Assistant access token, stored in Vault at
# secret/homelab-monitoring/home-assistant (property: token)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-token
  namespace: homelab-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: home-assistant-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: homelab-monitoring/home-assistant
        property: token
