# Read-only local UniFi user, stored in Vault at secret/homelab-monitoring/unifi
# (properties: url, username, password). url is the console, e.g. https://<ip>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller-credentials
  namespace: homelab-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: unpoller-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        UP_UNIFI_DEFAULT_URL: "{{ .url }}"
        UP_UNIFI_DEFAULT_USER: "{{ .username }}"
        UP_UNIFI_DEFAULT_PASS: "{{ .password }}"
  data:
    - secretKey: url
      remoteRef:
        key: homelab-monitoring/unifi
        property: url
    - secretKey: username
      remoteRef:
        key: homelab-monitoring/unifi
        property: username
    - secretKey: password
      remoteRef:
        key: homelab-monitoring/unifi
        property: password
