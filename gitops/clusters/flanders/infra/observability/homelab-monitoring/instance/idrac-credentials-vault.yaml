# Read-only Redfish user shared by all iDRACs, stored in Vault at
# secret/homelab-monitoring/idrac (properties: username, password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idrac-credentials
  namespace: homelab-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: idrac-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CONFIG_DEFAULT_USERNAME: "{{ .username }}"
        CONFIG_DEFAULT_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: homelab-monitoring/idrac
        property: username
    - secretKey: password
      remoteRef:
        key: homelab-monitoring/idrac
        property: password
