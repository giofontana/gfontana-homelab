# Pi-hole address and app password, stored in Vault at
# secret/homelab-monitoring/pihole (properties: host, password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pihole-credentials
  namespace: homelab-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pihole-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PIHOLE_HOSTNAME: "{{ .host }}"
        PIHOLE_PASSWORD: "{{ .password }}"
  data:
    - secretKey: host
      remoteRef:
        key: homelab-monitoring/pihole
        property: host
    - secretKey: password
      remoteRef:
        key: homelab-monitoring/pihole
        property: password
