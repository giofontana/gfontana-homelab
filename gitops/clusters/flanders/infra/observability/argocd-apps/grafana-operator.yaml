apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  labels:
    gitops.ownedBy: default
spec:
  destination:
    namespace: homelab-monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    path: gitops/clusters/flanders/infra/observability/grafana-operator/aggregate
    repoURL: https://github.com/giofontana/gfontana-homelab.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    # homelab-monitoring is owned by the homelab-monitoring app; create it if this app syncs first
    syncOptions:
      - CreateNamespace=true
