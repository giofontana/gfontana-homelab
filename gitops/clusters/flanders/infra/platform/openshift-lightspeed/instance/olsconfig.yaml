apiVersion: ols.openshift.io/v1alpha1
kind: OLSConfig
metadata:
  name: cluster
spec:
  llm:
    providers:
      # No native Anthropic provider type. Use the OpenAI-compatible endpoint via
      # rhoai_vllm: it calls /v1/chat/completions, while type openai calls
      # /v1/responses, which Anthropic does not implement (404).
      - name: anthropic
        type: rhoai_vllm
        url: https://api.anthropic.com/v1
        credentialsSecretRef:
          name: llm-credentials
        models:
          - name: claude-haiku-5-5
  ols:
    defaultProvider: anthropic
    defaultModel: claude-haiku-5-5
    guardrails:
      # The tool-result classifier sends response_format json_schema without
      # "strict", which Anthropic rejects (400), so every MCP tool call fails.
      # Re-enable once lightspeed-service sends strict.
      toolResultInspection:
        enabled: false
