apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-credentials
  namespace: openshift-lightspeed
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-credentials
    creationPolicy: Owner
  data:
    - secretKey: apitoken
      remoteRef:
        key: openshift-lightspeed/llm-credentials
        property: apitoken
