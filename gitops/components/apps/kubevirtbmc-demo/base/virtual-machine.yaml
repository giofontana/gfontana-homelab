apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: bmc-test
  namespace: kubevirtbmc-demo
  labels:
    app: bmc-test
spec:
  # Manual so power state is driven by the virtual BMC (IPMI/Redfish)
  runStrategy: Manual
  # Blank, persistent root disk to install an OS onto from the virtual media ISO.
  # Not named bmc-test: KubeVirtBMC uses the VM name for the ISO DataVolume.
  dataVolumeTemplates:
    - metadata:
        name: bmc-test-rootdisk
      spec:
        source:
          blank: {}
        storage:
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: 30Gi
          storageClassName: ocs-storagecluster-ceph-rbd-virtualization
          volumeMode: Block
  template:
    metadata:
      labels:
        app: bmc-test
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            # Empty CD-ROM drive: Redfish InsertMedia hot-plugs the ISO here
            - name: cdrom
              cdrom:
                bus: sata
          interfaces:
            - name: default
              masquerade: {}
        # Sized for booting a Fedora Live ISO
        resources:
          requests:
            memory: 4Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: bmc-test-rootdisk
