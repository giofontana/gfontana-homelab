apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: bmc-test
  namespace: kubevirtbmc-demo
  labels:
    app: bmc-test
spec:
  # Manual so power state is driven by the virtual BMC (IPMI/Redfish)
  runStrategy: Manual
  template:
    metadata:
      labels:
        app: bmc-test
    spec:
      domain:
        cpu:
          cores: 2
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            # Empty CD-ROM drive: Redfish InsertMedia hot-plugs the ISO here
            - name: cdrom
              cdrom:
                bus: sata
          interfaces:
            - name: default
              masquerade: {}
        # Sized for booting a Fedora Live ISO
        resources:
          requests:
            memory: 4Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/kubevirt/cirros-container-disk-demo
