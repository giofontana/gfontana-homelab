apiVersion: bmc.kubevirt.io/v1beta1
kind: VirtualMachineBMC
metadata:
  name: bmc-test
  namespace: kubevirtbmc-demo
spec:
  virtualMachineRef:
    name: bmc-test
  authSecretRef:
    name: bmc-test-credentials
  ipmi:
    enabled: true
  redfish:
    virtualMedia:
      # Block avoids CDI filesystem overhead on the exact-size ISO volume
      storage:
        storageClassName: ocs-storagecluster-ceph-rbd-virtualization
        volumeMode: Block
  # MetalLB assigns an IP from ip-addresspool-vlan101
  service:
    type: LoadBalancer
    # KubeVirtBMC (v0.11.0) resets the Service annotations to exactly this map,
    # while MetalLB re-adds this one; without it they fight in a hot loop that
    # OOMKills the controller
    annotations:
      metallb.io/ip-allocated-from-pool: ip-addresspool-vlan101
