kind: PersistentVolume
apiVersion: v1
metadata:
  name: media-pv
spec:
  claimRef:
    namespace: frigate
    name: media-pvc
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: "/mnt/pool0/media/cameras"
    # TrueNAS address on VLAN 101 (same L2 as the nodes) so NFS is not routed via the gateway
    server: "192.168.101.3"
