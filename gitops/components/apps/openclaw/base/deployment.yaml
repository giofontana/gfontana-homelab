# Adapted from upstream scripts/k8s/manifests/deployment.yaml (openclaw/openclaw).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  labels:
    app: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      serviceAccountName: openclaw
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-config
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              # The PVC is mounted at /home/node, so its root (owned by root via fsGroup) is $HOME and
              # .openclaw is created by UID 1000. OpenClaw chmods its state dir to 0700 and needs to own it.
              mkdir -p /home/node/.openclaw
              # Seed-if-missing: the PVC copy owns config after first boot so edits made
              # through OpenClaw (onboard, channels add, doctor --fix, Control UI) survive restarts.
              [ -f /home/node/.openclaw/openclaw.json ] || cp /config/openclaw.json /home/node/.openclaw/openclaw.json
              mkdir -p /home/node/.openclaw/workspace
              [ -f /home/node/.openclaw/workspace/AGENTS.md ] || cp /config/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md
              # Extra agents: ConfigMap keys named <agent-id>__<FILE> seed ~/.openclaw/workspace-<agent-id>/<FILE>.
              for f in /config/*__*; do
                [ -e "$f" ] || continue
                name=${f##*/}; agent=${name%%__*}; file=${name#*__}
                mkdir -p "/home/node/.openclaw/workspace-$agent"
                [ -f "/home/node/.openclaw/workspace-$agent/$file" ] || cp "$f" "/home/node/.openclaw/workspace-$agent/$file"
              done
              # Private workspace files from Vault (openclaw-workspace Secret, same <agent-id>__<FILE> naming).
              # Vault is the source of truth, so these overwrite the workspace copy on every start.
              for f in /config-secret/*__*; do
                [ -e "$f" ] || continue
                name=${f##*/}; agent=${name%%__*}; file=${name#*__}
                mkdir -p "/home/node/.openclaw/workspace-$agent"
                cp "$f" "/home/node/.openclaw/workspace-$agent/$file"
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 64Mi
              cpu: 100m
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node
            - name: config
              mountPath: /config
            - name: workspace-secret
              mountPath: /config-secret
              readOnly: true
        # ffmpeg/ffprobe for the gateway, from BtbN's build (linked from ffmpeg.org; glibc-only deps,
        # which the Debian-based gateway has). Installed once into ~/.ffmpeg/bin on the PVC and reused.
        # OpenClaw only runs ffmpeg from trusted system dirs (/usr/bin, /bin, ..., /snap/bin), never
        # from PATH, so the gateway mounts this dir read-only at /snap/bin (unused in the image).
        # Non-fatal: if the download fails, OpenClaw still starts and the next start retries.
        # To update, delete ~/.ffmpeg/bin/ffmpeg and ~/.ffmpeg/bin/ffprobe and restart.
        - name: install-ffmpeg
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              bin=/home/node/.ffmpeg/bin
              mkdir -p "$bin"
              # Move binaries from the previous install location instead of downloading again.
              for b in ffmpeg ffprobe; do
                [ -f "/home/node/.local/bin/$b" ] && [ ! -f "$bin/$b" ] && mv "/home/node/.local/bin/$b" "$bin/$b"
              done
              [ -f "$bin/ffmpeg" ] && [ -f "$bin/ffprobe" ] && exit 0
              url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz
              mkdir -p /tmp/ff
              if wget -qO /tmp/ff/ffmpeg.tar.xz "$url" && tar -xJf /tmp/ff/ffmpeg.tar.xz -C /tmp/ff; then
                cp /tmp/ff/*/bin/ffmpeg /tmp/ff/*/bin/ffprobe "$bin/" && echo "ffmpeg installed"
              else
                echo "WARNING: ffmpeg download failed; continuing without it"
              fi
              # /tmp is the gateway's emptyDir too; don't leave the archive behind.
              rm -rf /tmp/ff
              exit 0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: "1"
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node
            - name: tmp-volume
              mountPath: /tmp
      containers:
        - name: gateway
          # Bump this immutable versioned tag when upgrading OpenClaw.
          image: ghcr.io/openclaw/openclaw:2026.7.1-2-slim
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/dist/index.js
            - gateway
            - run
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/.openclaw
            - name: NODE_ENV
              value: production
            # Lets openclaw.json $include the git-managed files mounted from the ConfigMap.
            - name: OPENCLAW_INCLUDE_ROOTS
              value: /config-git
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
          # Probes assert the JSON probe contract, not just the status code: the
          # Control UI serves a catch-all 200 for unknown paths.
          startupProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/readyz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ready === true ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/healthz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ok === true ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "require('http').get('http://127.0.0.1:18789/readyz', r => { let b = ''; r.on('data', d => b += d); r.on('end', () => { try { process.exit(r.statusCode < 400 && JSON.parse(b).ready === true ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node
            - name: tmp-volume
              mountPath: /tmp
            # Git-owned config sections (agents.json5, mcp.json5) pulled in via $include.
            - name: config
              mountPath: /config-git
              readOnly: true
            # ffmpeg/ffprobe from the install-ffmpeg init container, in a dir OpenClaw trusts.
            - name: openclaw-home
              mountPath: /snap/bin
              subPath: .ffmpeg/bin
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: openclaw-home-pvc
        - name: config
          configMap:
            name: openclaw-config
        # Optional: without the Secret (no secret/openclaw/workspace in Vault) the pod still starts.
        - name: workspace-secret
          secret:
            secretName: openclaw-workspace
            optional: true
        - name: tmp-volume
          emptyDir: {}
