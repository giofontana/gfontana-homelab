# The image runs as the "node" user (UID 1000), which restricted-v2 rejects.
# nonroot-v2 allows a fixed non-root UID while keeping the rest of the restrictions.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-nonroot-v2
  namespace: openclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
- kind: ServiceAccount
  name: openclaw
  namespace: openclaw
