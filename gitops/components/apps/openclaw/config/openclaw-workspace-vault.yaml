# Private agent workspace files that must not be in git (e.g. TOOLS.md with device names).
# Each property of secret/openclaw/workspace is a file, named <agent-id>__<FILE>
# (e.g. home-assistant__TOOLS.md). The init container copies them into
# ~/.openclaw/workspace-<agent-id>/ on every start, overwriting the workspace copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-workspace
  namespace: openclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openclaw-workspace
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: openclaw/workspace
