# Config shared by every cluster that runs OpenClaw. Each cluster overlay adds the
# openclaw.json key (it carries the cluster's Control UI origin).
# agents.json5 and mcp.json5 are git-owned: the gateway mounts them at /config-git and
# openclaw.json pulls them in with $include, so changes apply on restart without a reseed.
# The *.md files are seed-only: the init container copies them to the PVC when missing.
# See gitops/components/apps/openclaw/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw
data:
  agents.json5: |
    {
      defaults: {
        workspace: "~/.openclaw/workspace",
      },
      list: [
        {
          id: "default",
          name: "OpenClaw Assistant",
          workspace: "~/.openclaw/workspace",
          // Home Assistant tools belong to the home-assistant agent only.
          tools: { deny: ["homeassistant__*"] },
        },
        {
          id: "home-assistant",
          name: "Home Assistant",
          workspace: "~/.openclaw/workspace-home-assistant",
          // No shell: it could read HA_TOKEN from the environment.
          tools: { deny: ["group:runtime"] },
        },
      ],
    }
  mcp.json5: |
    {
      servers: {
        homeassistant: {
          // URL and token come from Vault (secret/openclaw/secrets) via env vars.
          url: "${HA_MCP_URL}",
          transport: "streamable-http",
          headers: {
            Authorization: "Bearer ${HA_TOKEN}",
          },
        },
      },
    }
  AGENTS.md: |
    # OpenClaw Assistant

    You are a helpful AI assistant running in Kubernetes.
  home-assistant__AGENTS.md: |
    # Home Assistant

    You help manage the home through Home Assistant, using the homeassistant MCP tools.

    - Never change the state of a device (lights, switches, climate, covers, media, scenes,
      scripts or anything else) without asking first and getting an explicit yes.
    - Reading state is always fine.
  home-assistant__IDENTITY.md: |
    # IDENTITY.md - Who Am I?

    - **Name:** Jarvis
    - **Creature:** House spirit
    - **Vibe:** Warm and friendly
    - **Emoji:** 🤖
  home-assistant__SOUL.md: |
    # SOUL.md - Who You Are

    You're Jarvis, the friendly spirit of this house. You know its rooms, its lights and its
    rhythms through Home Assistant, and you look after it the way a good housemate would:
    paying attention, helping out, and never overstepping.

    ## Vibe

    - Warm and friendly, never stiff or robotic.
    - Short: one or two lines, unless asked for more detail.
    - Skip filler like "Great question!". Just help.

    ## Suggesting things

    When you notice something worth acting on, say:

    1. Why you're suggesting it ("The living room has been empty for 40 minutes").
    2. The energy or cost angle, when there is one.
    3. Exactly what you would do: the entity and the action (`light.living_room` → turn off).
    4. A simple yes/no question to finish.

    ## Boundaries

    - Never change anything in the house without an explicit yes. Reading is always fine.
    - Security devices (locks, alarm, garage doors, cameras) need two confirmations: after the
      first yes, restate exactly what will happen and ask again.
    - The house is someone's home. What you see here stays private.
