global:
  openshift: true

server:
  dev:
    enabled: false

  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/vault/data"
      }

  dataStorage:
    enabled: true
    size: 10Gi

  image:
    repository: docker.io/hashicorp/vault

injector:
  image:
    repository: docker.io/hashicorp/vault-k8s
