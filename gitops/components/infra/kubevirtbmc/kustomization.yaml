apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# KubeVirtBMC: virtual BMC (IPMI/Redfish) for KubeVirt VMs
# https://docs.kubevirtbmc.io/getting-started/
resources:
  - https://github.com/kubevirtbmc/kubevirtbmc/releases/download/v0.11.0/kubevirtbmc-install.yaml

patches:
  # Upstream ships unrendered SERVICE_NAME/SERVICE_NAMESPACE placeholders
  - target:
      group: cert-manager.io
      kind: Certificate
      name: kubevirtbmc-metrics-certs
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - kubevirtbmc-controller-manager-metrics-service.kubevirtbmc-system.svc
          - kubevirtbmc-controller-manager-metrics-service.kubevirtbmc-system.svc.cluster.local
