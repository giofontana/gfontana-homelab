# UniFi Poller, Prometheus output only. The controller URL and login come from
# UP_UNIFI_DEFAULT_URL / UP_UNIFI_DEFAULT_USER / UP_UNIFI_DEFAULT_PASS in the
# unpoller-credentials Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpoller
  labels:
    app.kubernetes.io/name: unpoller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unpoller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unpoller
    spec:
      containers:
        - name: unpoller
          image: ghcr.io/unpoller/unpoller:v5.5.0
          env:
            - name: UP_INFLUXDB_DISABLE
              value: "true"
            - name: UP_PROMETHEUS_HTTP_LISTEN
              value: ":9130"
            # UniFi consoles serve a self-signed certificate
            - name: UP_UNIFI_DEFAULT_VERIFY_SSL
              value: "false"
          envFrom:
            - secretRef:
                name: unpoller-credentials
          ports:
            - name: metrics
              containerPort: 9130
          readinessProbe:
            tcpSocket:
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: unpoller
  labels:
    app.kubernetes.io/name: unpoller
spec:
  selector:
    app.kubernetes.io/name: unpoller
  ports:
    - name: metrics
      port: 9130
      targetPort: metrics
