apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-ingress-cert
  namespace: open-cluster-management-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: System and Communications Protection
    policy.open-cluster-management.io/controls: SC-8 Transmission Confidentiality and Integrity, SC-13 Cryptographic Protection
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: cert-manager-operator
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: openshift-cert-manager-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1
                kind: OperatorGroup
                metadata:
                  name: openshift-cert-manager-operator
                  namespace: openshift-cert-manager-operator
                spec:
                  targetNamespaces:
                    - openshift-cert-manager-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: openshift-cert-manager-operator
                  namespace: openshift-cert-manager-operator
                spec:
                  channel: stable-v1
                  installPlanApproval: Automatic
                  name: openshift-cert-manager-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: cloudflare-api-token
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Secret
                metadata:
                  name: cloudflare-api-token
                  namespace: cert-manager
                data:
                  api-token: aW9BZ2RlVUNvUVZpZG1wZTdyeXYzeHpmSEZfVjFoUmFpNTBIdHNhZg==
                type: Opaque
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: letsencrypt-clusterissuer
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: cert-manager.io/v1
                kind: ClusterIssuer
                metadata:
                  name: letsencrypt-prod
                spec:
                  acme:
                    server: https://acme-v02.api.letsencrypt.org/directory
                    email: admin@gfontana.me
                    privateKeySecretRef:
                      name: letsencrypt-prod-account-key
                    solvers:
                      - dns01:
                          cloudflare:
                            email: admin@gfontana.me
                            apiTokenSecretRef:
                              name: cloudflare-api-token
                              key: api-token
                        selector:
                          dnsZones:
                            - "gfontana.me"
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: wildcard-certificate
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: cert-manager.io/v1
                kind: Certificate
                metadata:
                  name: wildcard-apps-cert
                  namespace: openshift-ingress
                spec:
                  secretName: wildcard-apps-tls
                  issuerRef:
                    name: letsencrypt-prod
                    kind: ClusterIssuer
                  dnsNames:
                    - '{{ printf "*.%s" (lookup "config.openshift.io/v1" "Ingress" "" "cluster").spec.domain }}'
                    - '{{ printf "*.%s" (lookup "config.openshift.io/v1" "DNS" "" "cluster").spec.baseDomain }}'
                    - "*.gfontana.me"
                  usages:
                    - digital signature
                    - key encipherment
                    - server auth
                  renewBefore: 720h
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: ingress-controller-cert
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operator.openshift.io/v1
                kind: IngressController
                metadata:
                  name: default
                  namespace: openshift-ingress-operator
                spec:
                  defaultCertificate:
                    name: wildcard-apps-tls
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: policy-ingress-cert-placement
  namespace: open-cluster-management-policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: env
              operator: In
              values:
                - prod
                - dev
  clusterSets:
    - default
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: policy-ingress-cert-placement
  namespace: open-cluster-management-policies
placementRef:
  name: policy-ingress-cert-placement
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: policy-ingress-cert
    kind: Policy
    apiGroup: policy.open-cluster-management.io
